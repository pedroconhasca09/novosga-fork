services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novosga-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: "dev-secret-change-me"

      DEFAULT_URI: "http://localhost:8080"

      DATABASE_URL: "postgresql://app:!ChangeMe!@database:5432/app?serverVersion=16&charset=utf8"

      MERCURE_URL: "http://mercure:3000/.well-known/mercure"
      MERCURE_PUBLIC_URL: "http://localhost:3000/.well-known/mercure"
      MERCURE_JWT_SECRET: "!ChangeThisMercureHubJWTSecretKey!"
      MERCURE_PUBLISHER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"

      APP_LANGUAGE: pt_BR

      OAUTH_PASSPHRASE: "!ChangeThisPassphrase!"
      OAUTH_ENCRYPTION_KEY: "!ChangeThisEncryptionKey!"

    depends_on:
      database:
        condition: service_healthy
      mercure:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    container_name: novosga-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: "!ChangeMe!"
      POSTGRES_USER: app
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app", "-U", "app"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data

  mercure:
    image: dunglas/mercure
    container_name: novosga-mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ":3000"
      MERCURE_PUBLISHER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
      MERCURE_SUBSCRIBER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:8080
    healthcheck:
     test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://localhost:3000/"]
     timeout: 5s
     retries: 5
     start_period: 10s
    volumes:
      - mercure_data:/data
      - mercure_config:/config

volumes:
  database_data:
  mercure_data:
  mercure_config: